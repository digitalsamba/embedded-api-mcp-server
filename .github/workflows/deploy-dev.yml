# Development MCP Server Deployment
#
# Builds and publishes the dev image to the private registry.
# Triggers automatically on push to develop branch.
#
# Deployment is PULL-BASED: this workflow does not connect to the deployment
# host. The host pulls the :latest tag on a short timer and restarts itself
# when the image digest changes. See the internal ops docs for that side.
#
# GitHub Secrets Required:
#   Repository secrets:
#     - DOCKER_REGISTRY: registry hostname
#     - REGISTRY_USERNAME: push account (scoped to this image)
#     - REGISTRY_PASSWORD: push account password
#
#   Environment secrets (development):
#     - MCP_URL: Public URL for health checks
#
# The DEPLOYMENT_USER / DEPLOYMENT_SSH_KEY / DEPLOYMENT_SERVER / DEPLOYMENT_PATH
# secrets are no longer used by this workflow.

name: Deploy Dev MCP Server

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  IMAGE_NAME: digitalsamba-mcp-server

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:ci
        continue-on-error: true

  build-and-deploy:
    name: Build and Deploy to Dev
    needs: test
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Calculate commits ahead of latest tag
        id: commits
        run: |
          # Get the latest tag by date (works even if tag is on different branch)
          LATEST_TAG=$(git tag --sort=-creatordate | head -1)
          if [ -n "$LATEST_TAG" ]; then
            # Find merge base between tag and HEAD, then count commits since
            MERGE_BASE=$(git merge-base $LATEST_TAG HEAD 2>/dev/null || echo "")
            if [ -n "$MERGE_BASE" ]; then
              COMMITS_AHEAD=$(git rev-list ${MERGE_BASE}..HEAD --count)
            else
              COMMITS_AHEAD=0
            fi
          else
            COMMITS_AHEAD=0
          fi
          echo "ahead=$COMMITS_AHEAD" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG, Merge base: $MERGE_BASE, Commits ahead: $COMMITS_AHEAD"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            COMMITS_AHEAD=${{ steps.commits.outputs.ahead }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deployment is pull-based: the host pulls :latest on a short timer and
      # restarts compose when the digest changes. CI has no path into the host.
      - name: Wait for host to pull and redeploy
        run: |
          EXPECTED=$(node -p "require('./package.json').version")
          echo "Image pushed. Waiting for the dev host timer to pick it up (expecting version $EXPECTED, up to 6 min)..."
          UP=0
          for i in $(seq 1 18); do
            sleep 20
            BODY=$(curl -s --max-time 10 ${{ secrets.MCP_URL }}/health || echo "")
            STATUS=$(echo "$BODY" | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
            VERSION=$(echo "$BODY" | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
            echo "attempt $i: status=${STATUS:-none} version=${VERSION:-none}"
            [ "$STATUS" = "ok" ] && UP=1
            if [ "$VERSION" = "$EXPECTED" ]; then
              echo "SERVED_VERSION=$VERSION" >> $GITHUB_ENV
              echo "Host is serving $VERSION"
              exit 0
            fi
          done
          # The health endpoint only reports package version, so a commit that does
          # not bump the version is indistinguishable from a stale deploy. Treat a
          # healthy-but-unchanged version as a warning, a dead endpoint as failure.
          if [ "$UP" = "1" ]; then
            echo "::warning::Host healthy but still serving ${VERSION:-unknown}, expected $EXPECTED. Check the deploy timer on the dev host."
            exit 0
          fi
          echo "Health endpoint never returned status=ok within 6 minutes"
          curl -v ${{ secrets.MCP_URL }}/health || true
          exit 1

      - name: Deployment summary
        run: |
          echo "## 🚀 Dev MCP Server Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | development |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ secrets.MCP_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
