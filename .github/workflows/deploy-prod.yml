# Production MCP Server Deployment
#
# Builds and publishes the production image to the private registry.
# Triggers on v* tags or manual dispatch.
#
# Deployment is PULL-BASED: this workflow does not connect to the deployment
# host. The host pulls the :production tag on a short timer and restarts itself
# when the image digest changes. See the internal ops docs for that side.
#
# GitHub Secrets Required:
#   Repository secrets:
#     - DOCKER_REGISTRY: registry hostname
#     - REGISTRY_USERNAME: push account (scoped to this image)
#     - REGISTRY_PASSWORD: push account password
#
#   Environment secrets (production):
#     - MCP_URL: Public URL (https://mcp.digitalsamba.com)
#
# The DEPLOYMENT_USER / DEPLOYMENT_SSH_KEY / DEPLOYMENT_SERVER / DEPLOYMENT_PATH
# secrets are no longer used by this workflow.

name: Deploy Production MCP Server

on:
  push:
    tags:
      - 'v*'  # Triggers on v1.0.0, v1.0.1, etc.
  workflow_dispatch:  # Manual trigger as backup

env:
  IMAGE_NAME: digitalsamba-mcp-server

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:ci

  build-and-deploy:
    name: Build and Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Use git tag (e.g., v1.0.0 -> 1.0.0)
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # Fallback to package.json for manual dispatch
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:production
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deployment is pull-based: the host pulls :production on a short timer and
      # restarts compose when the digest changes. CI has no path into the host.
      # The host's docker-compose.yml and .env are host-managed; they are no
      # longer copied from this repo on deploy.
      - name: Wait for host to pull and redeploy
        run: |
          EXPECTED="${{ steps.version.outputs.version }}"
          EXPECTED_COMMIT="${{ github.sha }}"
          echo "Image pushed. Waiting for the prod host timer to pick it up (expecting commit $EXPECTED_COMMIT / version $EXPECTED, up to 10 min)..."
          UP=0
          for i in $(seq 1 30); do
            sleep 20
            BODY=$(curl -s --max-time 10 ${{ secrets.MCP_URL }}/health || echo "")
            STATUS=$(echo "$BODY" | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
            VERSION=$(echo "$BODY" | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
            COMMIT=$(echo "$BODY" | grep -o '"commit":"[^"]*"' | cut -d'"' -f4)
            echo "attempt $i: status=${STATUS:-none} version=${VERSION:-none} commit=${COMMIT:-none}"
            [ "$STATUS" = "ok" ] && UP=1
            if [ "$COMMIT" = "$EXPECTED_COMMIT" ]; then
              echo "Production is serving commit $COMMIT (version $VERSION)"
              exit 0
            fi
            # Fallback while the running image predates the commit field in /health:
            # release versions are unique per tag, so a version match is trustworthy
            if [ -z "$COMMIT" ] && [ "$VERSION" = "$EXPECTED" ]; then
              echo "Production is serving $VERSION (no commit field yet)"
              exit 0
            fi
          done
          echo "Production did not report version $EXPECTED within 10 minutes (last: ${VERSION:-none}, healthy=$UP)"
          echo "Check the deploy timer on the production host"
          curl -v ${{ secrets.MCP_URL }}/health || true
          exit 1

      - name: Deployment summary
        run: |
          echo "## Production MCP Server Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | production |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ secrets.MCP_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

      - name: Sync develop branch with main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout develop
          git merge origin/main --no-edit -m "chore: sync develop with main after ${{ steps.version.outputs.version }} release"
          git push origin develop
          echo "✅ Develop branch synced with main" >> $GITHUB_STEP_SUMMARY
