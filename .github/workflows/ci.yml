name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Run tests with coverage
      run: npm run test:ci
      env:
        DIGITAL_SAMBA_DEVELOPER_KEY: ${{ secrets.DIGITAL_SAMBA_DEVELOPER_KEY || 'mock-key-for-testing' }}
        CI: true

    - name: Update coverage gist
      if: matrix.node-version == '22.x' && github.ref == 'refs/heads/main'
      run: |
        COVERAGE=$(node -p "Math.round(require('./coverage/coverage-summary.json').total.lines.pct)")
        
        # Update gist with coverage percentage
        curl -X PATCH \
          -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/gists/${{ secrets.GIST_ID }} \
          -d '{
            "files": {
              "coverage.json": {
                "content": "{\"coverage\": '$COVERAGE'}"
              }
            }
          }'

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Check formatting
      run: npm run format:check
  # Non-blocking: reports, never fails the build. Production dependencies
  # only; v1.3.0 shipped after a pass found 1 critical and 4 high here.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: npm audit (production dependencies)
        run: |
          npm audit --omit=dev --audit-level=high | tee audit.txt || {
            echo "::warning::npm audit found high or critical issues in production dependencies"
            { echo "## npm audit (production)"; echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
